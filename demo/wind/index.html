<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>具身智能体 · 风机场景演示</title>
    <style>
        :root {
            --bg: #0f1216;
            --panel: rgba(18, 22, 28, 0.9);
            --border: rgba(255, 255, 255, 0.12);
            --text: #e6e9ee;
            --muted: #8b95a3;
            --accent: #4ea8ff;
            --ok: #46c48a;
            --warn: #f0a54a;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
        #cesiumContainer { position: absolute; inset: 0; }

        /* —— 右下角停靠区 ——
           默认只有一颗球。所有文字信息浮在球上方，展开面板也是向上长，
           不遮挡场景中心的视线。 */
        #dock {
            position: absolute; right: 20px; bottom: 20px;
            display: flex; flex-direction: column; align-items: flex-end;
            gap: 10px;
            font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            pointer-events: none;      /* 空白区域不挡鼠标 */
        }
        #dock > * { pointer-events: auto; }

        /* —— 状态信息：转写 + 当前状态 —— */
        #info {
            display: flex; flex-direction: column; align-items: flex-end;
            gap: 3px; max-width: min(360px, calc(100vw - 40px));
            text-align: right;
        }
        #transcript {
            font-size: 14px; color: var(--accent); font-style: italic;
            padding: 3px 10px; border-radius: 8px;
            background: rgba(18, 22, 28, 0.72);
            backdrop-filter: blur(8px);
            min-height: 0;
        }
        #transcript:empty { display: none; }
        #readout {
            font-size: 11px; color: var(--muted);
            font-variant-numeric: tabular-nums;
            padding: 2px 8px; border-radius: 6px;
            background: rgba(18, 22, 28, 0.6);
        }
        #demoNote {
            font-size: 11px; color: var(--warn);
            padding: 2px 8px; border-radius: 6px;
            background: rgba(18, 22, 28, 0.6);
        }
        #demoNote:empty { display: none; }

        /* —— 展开面板 —— */
        #panel {
            width: min(340px, calc(100vw - 40px));
            padding: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
            transform-origin: bottom right;
            transition: opacity .16s ease, transform .16s ease;
        }
        #panel[hidden] { display: none; }

        #cmd {
            width: 100%; padding: 9px 11px;
            font: inherit; font-size: 13px;
            background: rgba(0, 0, 0, .35);
            border: 1px solid var(--border);
            border-radius: 9px; color: var(--text);
            outline: none;
        }
        #cmd:focus { border-color: var(--accent); }
        #cmd::placeholder { color: rgba(139, 149, 163, .75); }

        .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .chips button {
            font: inherit; font-size: 12px;
            padding: 4px 9px; border-radius: 999px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--border);
            color: var(--text); cursor: pointer;
            transition: background .15s, border-color .15s;
        }
        .chips button:hover { background: rgba(78, 168, 255, .18); border-color: rgba(78, 168, 255, .4); }
        .chips button:disabled { opacity: .5; cursor: default; }
        .chips .sep { width: 100%; height: 0; margin: 2px 0; }

        /* —— 悬浮球 —— */
        #orbRow { display: flex; align-items: center; gap: 8px; }

        #mic {
            width: 56px; height: 56px;
            display: grid; place-items: center;
            font-size: 22px; line-height: 1;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, rgba(78, 168, 255, .35), rgba(18, 22, 28, .92));
            border: 1px solid rgba(78, 168, 255, .35);
            color: var(--text); cursor: pointer;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
            transition: transform .14s ease, box-shadow .2s ease, border-color .2s ease;
            user-select: none;
        }
        #mic:hover { transform: scale(1.06); box-shadow: 0 8px 28px rgba(78, 168, 255, .3); }
        #mic:active { transform: scale(.96); }
        #mic[data-state="connecting"] {
            border-color: var(--warn);
            background: radial-gradient(circle at 32% 28%, rgba(240, 165, 74, .4), rgba(18, 22, 28, .92));
        }
        #mic[data-state="listening"] {
            border-color: rgba(70, 196, 138, .75);
            background: radial-gradient(circle at 32% 28%, rgba(70, 196, 138, .45), rgba(18, 22, 28, .92));
            animation: pulse 1.8s ease-in-out infinite;
        }
        #mic:disabled { opacity: .35; cursor: not-allowed; animation: none; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 6px 24px rgba(0, 0, 0, .5), 0 0 0 0 rgba(70, 196, 138, .45); }
            50%      { box-shadow: 0 6px 24px rgba(0, 0, 0, .5), 0 0 0 12px rgba(70, 196, 138, 0); }
        }

        /* 键盘按钮：打开输入面板 */
        #toggle {
            width: 34px; height: 34px;
            display: grid; place-items: center;
            font-size: 14px; line-height: 1;
            border-radius: 50%;
            background: rgba(18, 22, 28, .85);
            border: 1px solid var(--border);
            color: var(--muted); cursor: pointer;
            backdrop-filter: blur(10px);
            transition: color .15s, border-color .15s, transform .14s;
        }
        #toggle:hover { color: var(--text); border-color: rgba(78, 168, 255, .5); transform: scale(1.08); }
        #toggle[aria-expanded="true"] { color: var(--accent); border-color: rgba(78, 168, 255, .55); }

        /* —— 日志：默认隐藏，左上角 —— */
        #log {
            position: absolute; left: 16px; top: 16px;
            width: min(320px, calc(100vw - 32px));
            max-height: 42vh; overflow: auto;
            padding: 10px 12px;
            font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
            color: var(--muted);
            background: rgba(18, 22, 28, .72);
            border: 1px solid var(--border);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }
        #log[hidden] { display: none; }
        #log div { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
        #log div:first-child { color: var(--text); }

        /* 手机上球稍小，避免挡住场景 */
        @media (max-width: 480px) {
            #dock { right: 14px; bottom: 14px; gap: 8px; }
            #mic { width: 50px; height: 50px; font-size: 20px; }
            #panel { width: calc(100vw - 28px); }
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <div id="log" hidden></div>

    <div id="dock">
        <div id="panel" hidden>
            <input id="cmd" type="text" placeholder="说或输入目标，例如「去 7 号风机」" autocomplete="off">
            <div class="chips">
                <button data-cmd="去3号风机">去 3 号风机</button>
                <button data-cmd="去运维点">回运维点</button>
                <button data-cmd="往前走20米">往前走 20 米</button>
                <button data-cmd="往左一点">往左一点</button>
                <button data-cmd="跑起来">跑起来</button>
                <button data-cmd="停">停</button>
                <div class="sep"></div>
                <button id="demoBtn">▶ 自动演示</button>
                <button id="logBtn">日志</button>
            </div>
        </div>

        <div id="info">
            <div id="transcript"></div>
            <div id="readout">状态 idle</div>
            <div id="demoNote"></div>
        </div>

        <div id="orbRow">
            <button id="toggle" title="输入指令（按 / 也可）" aria-label="输入指令" aria-expanded="false">⌨</button>
            <button id="mic" title="开启持续语音" aria-label="开启持续语音" data-state="off">🎤</button>
        </div>
    </div>

    <script type="module" src="./index.ts"></script>
</body>
</html>
