<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>具身智能体 · 风机场景演示</title>
    <style>
        :root {
            --bg: #0f1216;
            --panel: rgba(18, 22, 28, 0.88);
            --border: rgba(255, 255, 255, 0.12);
            --text: #e6e9ee;
            --muted: #8b95a3;
            --accent: #4ea8ff;
            --ok: #46c48a;
            --warn: #f0a54a;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
        #cesiumContainer { position: absolute; inset: 0; }

        .hud {
            position: absolute;
            font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            backdrop-filter: blur(12px);
        }

        #panel {
            left: 16px; bottom: 16px;
            width: min(420px, calc(100vw - 32px));
            padding: 12px;
        }

        #panel h1 {
            font-size: 13px; font-weight: 600; margin: 0 0 2px;
            letter-spacing: .02em;
        }
        #panel .sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }

        #readout {
            font-size: 11px; color: var(--muted);
            font-variant-numeric: tabular-nums;
            padding: 6px 8px; margin-bottom: 8px;
            background: rgba(255,255,255,.04);
            border-radius: 6px;
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .chips button {
            font: inherit; font-size: 12px;
            padding: 5px 10px; border-radius: 999px;
            background: rgba(255,255,255,.06);
            border: 1px solid var(--border);
            color: var(--text); cursor: pointer;
            transition: background .15s;
        }
        .chips button:hover { background: rgba(78,168,255,.18); border-color: rgba(78,168,255,.4); }
        .chips button.primary {
            background: rgba(78,168,255,.22);
            border-color: rgba(78,168,255,.55);
            font-weight: 600;
        }
        .chips button:disabled { opacity: .55; cursor: default; }
        #demoNote {
            font-size: 11px; color: var(--accent);
            min-height: 16px; margin-bottom: 8px;
        }

        #cmd {
            width: 100%; padding: 9px 11px;
            font: inherit; font-size: 13px;
            background: rgba(0,0,0,.35);
            border: 1px solid var(--border);
            border-radius: 8px; color: var(--text);
            outline: none;
        }
        #cmd:focus { border-color: var(--accent); }

        .row { display: flex; gap: 6px; align-items: stretch; }
        .row #cmd { flex: 1; }
        #mic {
            flex: 0 0 auto; width: 40px;
            display: grid; place-items: center;
            background: rgba(255,255,255,.06);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); cursor: pointer; font-size: 15px;
            transition: background .15s, border-color .15s, box-shadow .15s;
        }
        #mic:hover { background: rgba(78,168,255,.16); border-color: rgba(78,168,255,.4); }
        #mic[data-state="connecting"] { border-color: var(--warn); color: var(--warn); }
        #mic[data-state="listening"] {
            background: rgba(70,196,138,.18); border-color: rgba(70,196,138,.6); color: var(--ok);
        }
        #mic[data-state="off"] { opacity: .8; }
        #mic:disabled { opacity: .35; cursor: not-allowed; }
        #transcript {
            font-size: 11px; color: var(--accent); min-height: 15px;
            margin-top: 6px; font-style: italic;
        }

        #log {
            position: absolute; right: 16px; top: 16px;
            width: min(320px, calc(100vw - 32px));
            max-height: 45vh; overflow: auto;
            padding: 10px 12px;
            font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
            color: var(--muted);
        }
        #log div { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
        #log div:first-child { color: var(--text); }

        .note {
            position: absolute; left: 16px; top: 16px;
            padding: 8px 12px; font-size: 11px; color: var(--muted);
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <div id="log" class="hud"></div>

    <div id="panel" class="hud">
        <h1>具身智能体 · 目标驱动漫游</h1>
        <div class="sub">说一个目标，人物自己走过去；走到一半可以改。</div>
        <div id="readout">状态 idle</div>
        <div id="demoNote"></div>
        <div class="chips">
            <button id="demoBtn" class="primary">▶ 自动演示</button>
            <button data-cmd="去3号风机">去 3 号风机</button>
            <button data-cmd="去运维点">回运维点</button>
            <button data-cmd="往前走20米">往前走 20 米</button>
            <button data-cmd="往左一点">往左一点</button>
            <button data-cmd="跑起来">跑起来</button>
            <button data-cmd="停">停</button>
        </div>
        <div class="row">
            <input id="cmd" type="text" placeholder="输入指令后回车，例如「去 7 号风机」" autocomplete="off">
            <button id="mic" title="开启持续语音" aria-label="开启持续语音" data-state="off">🎤</button>
        </div>
        <div id="transcript"></div>
    </div>

    <script type="module" src="./index.ts"></script>
</body>
</html>
