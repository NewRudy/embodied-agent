<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>具身智能体 · 空白场景</title>
    <style>
        /* 场景容器 + 图例。操作界面由 src/ui/orb.ts 挂载（shadow DOM），
           这里不需要写任何面板/按钮样式。 */
        :root { --muted: #8b95a3; --text: #e6e9ee; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; }
        /* canvas 是替换元素：只写 inset:0 不够，它的布局尺寸仍取位图属性。
           必须显式给 CSS 宽高，否则位图尺寸和布局尺寸会互相放大。 */
        #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        #legend {
            position: absolute; left: 16px; top: 16px;
            padding: 10px 12px; font-size: 11px; color: var(--muted);
            max-width: 260px;
            font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--muted);
            background: rgba(16, 20, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            backdrop-filter: blur(12px);
        }
        #legend b { color: var(--text); font-weight: 600; }
        #legend .dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            margin-right: 5px; vertical-align: middle;
        }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>

    <div id="legend">
        <b>空白场景</b><br>
        没有地形、没有模型、没有第三方资产。<br>
        只有一块平地、几个参照点、一个人物圆点。<br><br>
        <span class="dot" style="background:#4ea8ff"></span>人物
        <span class="dot" style="background:#46c48a"></span>参照点<br>
        <span class="dot" style="background:#f0a54a"></span>当前目标
    </div>

    <script type="module" src="./index.ts"></script>
</body>
</html>
